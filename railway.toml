# Railway — como este repositório deve ser construído.
#
# ATENÇÃO: o que está aqui NÃO controla o serviço web. O log de build de
# 21/08 mostra `load build definition from Dockerfile` e os estágios do
# Dockerfile da raiz (deps → builder → runner), com este arquivo dizendo
# NIXPACKS. O painel do Railway sobrepõe a configuração de raiz, e o serviço
# web está fixado em DOCKERFILE por lá. Para mudar o build do site, mexa no
# `Dockerfile` — não aqui.
#
# Então por que manter a linha? Porque ela protege os OUTROS serviços do
# projeto que saem deste mesmo repositório. O ws-server dos jogos multiplayer
# (`node server/ws-unified.js`) é um deles. Sem esta declaração o Railway
# escolhe o builder sozinho, e um `Dockerfile` na raiz ganha do Nixpacks —
# o ws-server passaria a subir numa imagem de 2,3GB feita para servir Next.
# Apagar esta linha é a armadilha, não a limpeza.
#
# `startCommand` continua fora daqui de propósito: valeria para TODOS os
# serviços, e o ws-server tem start próprio. Declarar start aqui derrubaria o
# WebSocket dos jogos multiplayer.
[build]
builder = "NIXPACKS"
